  p:['Zu den Tierarzt-Verdiensten in der Praxis gibt es nur eine Drittquelle.']},
 {t:'Lebensmittelkontrolleurin (Bezirksamt Berlin)',s:'2 Jahre Ausbildung, Alter bis 35',fit:['mid','Am Rand, nur in hohen Stufen'],
  rows:[['Was du brauchst','Fortbildungsabschluss in einem Lebensmittelberuf oder Techniker, Alter bis 35, Führerschein B'],['Dauer','2 Jahre Ausbildung (18 Monate Praxis, 6 Monate Theorie)'],['Verdienst','Ausbildung A 6; fertig A 9s (E 9a): **3.620 bis 4.616 €** (Stufe 1 bis 6 laut Tarifliste)']],
  sec:[{h:'Wichtig',ul:['Die Berliner Ausschreibung verlangt einen Berufsabschluss mit zusätzlicher Fortbildungsprüfung (BBiG/HwO) oder als Techniker mit staatlicher Prüfung in einem Lebensmittelberuf.','Gleichgestellt sind nur Bewerber aus dem mittleren allgemeinen Verwaltungsdienst mit mindestens 3 Jahren in der Lebensmittelaufsicht.','Deine Polizeiausbildung steht dort nicht, du müsstest also nachfragen.']}],
  calls:[['Landesamt für Gesundheit und Soziales','030 90229-0','E-Mail: Info-Berufe@lageso.berlin.de']],

 {t:'Tierpflegerin (Zoo, Tierpark)',s:'3 Jahre Ausbildung',fit:['bad','Nein'],
  rows:[['Was du brauchst','abgeschlossene Berufsausbildung als Zootierpfleger*in oder in einem grünen/handwerklichen Beruf (laut Zoo-Berlin-Anzeige)'],['Dauer','3 Jahre Ausbildung'],['Verdienst','Einstieg E 5: ca. **3.124 bis 3.783 €** (Stufe 1 bis 6, kommunaler Tarif TVöD). Zoo Berlin zahlt nach Haustarifvertrag, ohne Zahlen.']],

 {t:'Hundeführerin im Sicherheitsgewerbe (privat)',s:'Beamtenverhältnis fällt weg',fit:['bad','Nein'],
  rows:[['Was du brauchst','meist Sachkunde §34a, Hundeführerschein'],['Dauer','nicht geprüft'],['Verdienst','Stellentitel in Berlin und Umgebung nennen 16,80 bis 19,32 € pro Stunde, bei Vollzeit grob **2.900 bis 3.350 €** (eigene Rechnung mit 40 Wochenstunden)']]},
 {t:'Duales Studium mit Tierbezug: Agrarwirtschaft',s:'Hochschule Neubrandenburg',fit:['none','Gehalt danach offen'],
  p:['Direkt mit Tieren gibt es kaum duale Wege. Das einzige gefundene Beispiel ist Agrarwirtschaft dual an der Hochschule Neubrandenburg (Mecklenburg-Vorpommern): Bachelor of Science plus Berufsabschluss Landwirt/in, 9 Semester, mit Ausbildungsvertrag und Ausbildungsvergütung.','Voraussetzung sind Hochschulreife und ein Ausbildungsbetrieb in MV, Brandenburg oder Sachsen-Anhalt. Bewerbung bis 31.07. Tierhaltung ist dort nur ein Teil des Fachs. Das Gehalt danach ist nicht geprüft, ob es dein Ziel erreicht, ist offen.'],
  links:[[16,'Hochschule Neubrandenburg: Agrarwirtschaft dual (Flyer)']]},
 ],
 after:[{h:'Was die Zahlen zeigen',p:'Nur der Weg über das Tiermedizin-Studium zur Amtstierärztin liegt klar über deinem Ziel. Er ist aber lang und verlangt eine Hochschulzugangsberechtigung. Lebensmittelkontrolleurin liegt in den hohen Stufen über deiner heutigen Besoldung (A 8: 3.177 bis 4.050 €), verlangt aber eine neue Ausbildung und eine Qualifikation, die du vermutlich nicht hast. Tierpflegerin und Hundeführerin im Sicherheitsgewerbe liegen unter oder um dein jetziges Niveau. Diensthundführerin ist der einzige Tierweg, bei dem dein Gehalt gleich bleibt oder steigt.'},
  {h:'Ostsee',p:'Tierärzte, Veterinärämter und Zoos an der Ostsee (zum Beispiel Rostock, Stralsund, Kiel) sind noch nicht recherchiert. Die Gehaltszahlen gelten für Berlin beziehungsweise für den kommunalen Tarif, nicht für MV oder Schleswig-Holstein.'},
  {h:'Nicht geprüft',p:'Tierheilpraktiker und Tierphysiotherapie (meist selbstständig, Einkommen stark schwankend), Hundetrainer (Erlaubnis nach §11 Tierschutzgesetz), Förster und Ranger, Fischerei.'}]},

{id:'schutz',title:'Personenschutz',color:'--c-schutz',sub:'staatlich (Polizei, BKA) oder privat',
 hero:'Staatlicher Personenschutz verlangt den gehobenen Dienst. Privater Personenschutz ist formal leicht, bezahlt aber deutlich unter deinem Ziel.',
 glance:[['Staatlich, LKA 61','A 12: 4.331 bis 5.856 € brutto'],['Voraussetzung','gehobener Dienst (Studium)'],['Privat, Berlin im Schnitt','2.562 € brutto']],
 items:[
 {t:'Staatlich: Polizei Berlin, LKA 61',s:'A 12, gehobener Dienst',fit:['mid','Erst nach dem Aufstieg'],
  rows:[['Verdienst','A 12: **4.331 bis 5.856 € brutto**'],['Voraussetzung','laufbahnrechtliche Voraussetzungen des gehobenen Polizeivollzugsdienstes, bestandenes Personenschutz-Auswahlverfahren, Personenschutz-Basislehrgang'],['Dazu','erhöhte körperliche, psychische und einsatztaktische Leistungsfähigkeit']],
  p:['Als Polizeiobermeisterin (mittlerer Dienst) bist du dafür formal noch nicht qualifiziert. Der erste Schritt ist der Aufstieg in den gehobenen Dienst. Was die Behörde dafür heute verlangt, ist offen und muss bei der Personalstelle erfragt werden.'],
  sec:[{h:'Der Aufstieg in den gehobenen Dienst in Berlin',ul:['Die Polizei Berlin schreibt: Wer im mittleren Dienst eingestellt ist, kann nicht mehr extern in den gehobenen Dienst. Es gelten nur die behördeninternen Aufstiegsverfahren.','Beamtinnen und Beamte des mittleren Dienstes, die ihre Dienstbehörde zum Einführungsdienst in den gehobenen Polizeivollzugsdienst zulässt, absolvieren den Studiengang an der HWR Berlin und erwerben so die Laufbahnbefähigung.','Welche Voraussetzungen die Dienstbehörde heute für die Zulassung verlangt, steht nicht auf der Webseite. Ältere Berliner Verordnungen nannten für Polizeiobermeister (A 8) unter anderem mindestens vier Jahre im Amt und gute dienstliche Leistungen. Ob das noch gilt, klärt die Personalstelle.']},
   {h:'So gehst du vor',ol:['**Frag bei der Personalstelle nach dem aktuellen Aufstiegsverfahren:** Voraussetzungen, Termine, Bewerbung, dienstliche Beurteilung.','Beobachte die Ausschreibungen von LKA 61 im [[19|Berliner Karriereportal]].','Absolviere Personenschutz-Auswahlverfahren und Basislehrgang, sobald eine Stelle offen ist.']}],
  links:[[17,'LKA 61: Anforderungsprofil Personenschutz (PDF)'],[20,'Polizei Berlin: Studium und Aufstieg im gehobenen Dienst'],[21,'HWR Berlin: Studiengang Gehobener Polizeivollzugsdienst'],[19,'Berliner Karriereportal: Stellenausschreibungen'],[22,'Ältere Berliner Laufbahnverordnung, nur zur Orientierung (PDF)']]},
 {t:'Staatlich: BKA, Sicherungsgruppe',s:'gehobener Dienst plus Spezialausbildung',fit:['mid','Erst nach dem Aufstieg'],
  p:['Für den Personenschutz brauchst du die Ausbildung für den gehobenen Polizeivollzugsdienst und danach eine mehrmonatige Spezialausbildung im BKA, dazu kontinuierliches Training in Selbstverteidigung und Schießen.','Die Einheit „Auslands- und Spezialeinsätze“ nimmt laut Wikipedia Polizeibeamte aus BKA, Bund und Ländern ins Auswahlverfahren. Das ist keine offizielle Quelle.'],
  links:[[18,'BKA: Abteilung Sicherungsgruppe']]},
 {t:'Privat: Bewachungsgewerbe (§34a GewO)',s:'Gehalt, Befreiung, Lehrgang',fit:['bad','Gehalt weit unter 3.000 € netto'],
  p:['Der Einstieg wäre für dich formal leicht, das Gehalt liegt in Berlin und an der Ostsee aber deutlich unter deinem Ziel von 3.000 € netto. Beamtenstatus entfällt.'],
  sec:[{h:'Gehalt brutto pro Monat (Stepstone-Daten)',table:{head:['Region','unteres Viertel','Durchschnitt','oberes Viertel'],rows:[['Deutschland','2.152 €','2.845 €','3.887 €'],['Berlin','2.018 €','2.562 €','3.316 €'],['Schleswig-Holstein','1.875 €','2.408 €','2.893 €'],['Mecklenburg-Vorpommern','1.809 €','2.054 €','2.815 €']]},
    p:'In Rostock liegt der Durchschnitt laut derselben Quelle bei 2.073 € brutto. Für Berlin nennt die Quelle als Spanne 2.018 € (unteres Viertel) bis 3.316 € (oberes Viertel) brutto im Monat. Das sind Brutto-Werte, netto bleibt weniger.'},
   {h:'Was rechtlich nötig ist',ul:['Je nach Tätigkeit verlangt die IHK entweder die 40-stündige Unterrichtung oder die Sachkundeprüfung nach §34a GewO. Welche der beiden Stufen für Personenschutz gilt, klärst du mit der zuständigen IHK.','**Befreiung für dich:** Laut mehreren IHKs sind Personen mit einer Laufbahnprüfung zumindest für den mittleren Polizeidienst von Unterrichtung und Sachkundeprüfung befreit. Die Gemeinde als Erlaubnisbehörde entscheidet, ob die Befreiung für die konkrete Tätigkeit gilt. Die IHK stellt dafür keine Bescheinigung aus.','Das Mindestalter für Wachpersonal ist 18 Jahre. Ein Führungszeugnis ohne relevante Einträge nennen nur Drittseiten.','Wer sich selbstständig macht, braucht eine eigene Erlaubnis nach §34a und muss die Sachkundeprüfung ablegen oder eine gleichgestellte Qualifikation nachweisen.']},
   {h:'Weiterbildung',ul:['Personenschützer ist laut ausbildung.de kein Ausbildungsberuf.','Üblich sind Lehrgänge wie „Fachkraft für Personenschutz (IHK)“: ausbildung.de nennt 4 bis 5 Wochen und ca. 5.000 €, der Beispiel-Anbieter 4 bis 6 Wochen und 6.000 €. Unvergütet.','Der Beispiel-Lehrgang kostet 6.000 € (Mindestalter 25, Kleiner Waffenschein Pflicht, Unterrichtung nach §34a und Waffensachkunde oder polizeilicher Hintergrund vorteilhaft). Termine in Ludwigsburg bei Stuttgart: 12.04. bis 02.06.2027 und 20.09. bis 10.11.2027.']},
   {h:'Bewaffneter Personenschutz',ul:['Waffen führen darf nur, wer über den Bewachungsunternehmer benannt wird, und nur bei einem konkreten Auftrag für eine gefährdete Person (§ 19 WaffG) oder ein gefährdetes Objekt (§ 28 WaffG).','Die Wachperson muss mindestens 18, zuverlässig, persönlich geeignet und sachkundig nach § 7 WaffG sein.','Die Sachkunde kann auch durch eine behördliche oder staatlich anerkannte Ausbildung mit Bescheinigung gelten, wenn diese dafür geeignet war (§ 3 AWaffV).','Ob die Waffenbehörde deine Polizeiausbildung so anerkennt, steht in keiner Quelle: **bei der Waffenbehörde nachfragen.**']},
   {h:'Beamtenrecht',ul:['Solange du Beamtin bist, braucht jede entgeltliche Nebentätigkeit die vorherige Genehmigung. Sie wird versagt, wenn zu besorgen ist, dass dienstliche Interessen beeinträchtigt werden (§ 62 Landesbeamtengesetz Berlin).','Ein hauptberuflicher Wechsel in die Privatwirtschaft bedeutet, das Beamtenverhältnis zu verlassen.','Die Genehmigung ist auf höchstens zwei Jahre befristet. Als Versagungsgrund gilt in der Regel eine Nebentätigkeit von mehr als einem Fünftel der Wochenarbeitszeit oder eine, die wie ein Zweitberuf wirkt.','Die Folgen für Versorgung und Rente wurden nicht recherchiert.']},
   {h:'So gehst du vor',ol:['**Frag bei der zuständigen Erlaubnisbehörde (Ordnungsamt oder Gewerbeamt) nach**, ob deine Laufbahnprüfung als Befreiung anerkannt wird.','Wähle einen Personenschutz-Lehrgang mit IHK-Zertifikat aus.','Suche Stellen bei Bewachungsunternehmen. Auf Stepstone gab es am 22.11.2026 für Personenschutz in Berlin nur 2 Treffer, beide keine Personenschutz-Stellen (Ingenieur Hochspannung, Bürokraft). An der Ostsee ist das Angebot nach den Gehaltsdaten kleiner und niedriger bezahlt.']}],
  links:[[27,'IHK Rhein-Neckar: Befreiung von Unterrichtung und Sachkundeprüfung'],[28,'IHK Rheinhessen: Befreiungsmöglichkeiten Bewachungsgewerbe'],[25,'IHK Wiesbaden: Bewachungsgewerbe, alles Wichtige'],[26,'IHK Aachen: Unterrichtung oder Sachkundeprüfung?'],[29,'Personenschützer: Ausbildung und Gehalt (ausbildung.de)'],[30,'Beispiel: Fachkraft für Personenschutz (IHK)'],[23,'Gehalt Personenschützer bundesweit'],[35,'Gehalt Personenschützer in Berlin'],[24,'Gehalt Personenschützer in Mecklenburg-Vorpommern'],[36,'Stellen Personenschutz in Berlin (Stepstone)'],[31,'§ 28 WaffG (gesetze-im-internet.de)'],[33,'§ 3 AWaffV (Gesetzestext)'],[32,'Landkreis Mecklenburgische Seenplatte: Waffenschein für Bewachungspersonal'],[34,'Landesbeamtengesetz Berlin: Nebentätigkeit']]}
 ],after:[]},

{id:'feuer',title:'Feuerwehr',color:'--c-feuer',sub:'Berlin und fünf Städte an der Ostsee',
 hero:'Es gibt keinen Direktwechsel von der Polizei zur Feuerwehr. Du müsstest die Brandmeister-Ausbildung neu machen.',
 glance:[['In der Ausbildung','rund 1.470 bis 1.560 € brutto'],['Danach in Berlin','A 7 ab 3.021 € oder A 8 bis 4.050 € brutto'],['Offen','ob deine Polizeiausbildung als Berufsausbildung zählt']],
 items:[
 {t:'Was heißt 112 Classic, Direkt und Dual?',s:'die drei Wege der Berliner Feuerwehr',fit:null,
  p:['112 ist die Notrufnummer. Die Berliner Feuerwehr nutzt die drei Namen für ihre drei Wege in den Beruf:'],
  sec:[{h:'',ul:['**112 Classic:** der traditionelle Zugang zum mittleren feuerwehrtechnischen Dienst. Du brauchst vorher eine abgeschlossene Berufsausbildung (so steht es in der Ausschreibung). Für dich der naheliegende Weg, falls deine Polizeiausbildung gilt.','**112 Direkt:** der Zugang zum mittleren feuerwehrtechnischen Dienst direkt nach der Schule, ohne vorherige Berufsausbildung. Für dich vermutlich nicht nötig.','**112 Dual:** ein duales Studium für den gehobenen feuerwehrtechnischen Dienst.']}],
  note:'Die Erklärungen zu Classic und Direkt stammen wörtlich aus den Ausschreibungen ([[38|112 Classic]], [[39|112 Direkt]]). Die Einordnung von 112 Dual stammt aus einem Fachartikel von 2021 ([[40|Personalwirtschaft]]).'},
 {t:'112 Classic und 112 Direkt, Berlin',s:'mittlerer Dienst, Zahlen aus der Runde 2025/26',fit:['mid','Frag nach, ob deine Ausbildung zählt'],
  sec:[{h:'Vergleich',table:{head:['','112 Classic','112 Direkt'],rows:[['Für wen','Hauptschulabschluss plus abgeschlossene Ausbildung in einem anerkannten Ausbildungsberuf (oder technische Fachschule, Fachoberschule)','mittlerer Schulabschluss oder Abitur, noch keine abgeschlossene Ausbildung'],['Alter bei Beginn','18 bis 35 Jahre','16,5 bis 35 Jahre'],['Anwärterbezüge','in der Ausschreibung nicht genannt','1.467,66 € brutto, dazu Feuerwehrzulage 76,66 € ab dem 2. Jahr und Hauptstadtzulage 50 €'],['Dauer','in der Ausschreibung nicht genannt','3 Jahre'],['Frist der letzten Runde','30.06.2025','30.09.2025 (Start 01.05.2026)']]},
    p:'Gemeinsam: Größe 165 bis 195 cm, Schwimmabzeichen Silber (nicht älter als 2 Jahre), Führerschein Klasse B, Sporttest Fitnesslevel 2, einwandfreies Führungszeugnis, Feuerwehrdiensttauglichkeit.'},
   {h:'Neuere Ausschreibungen',ul:['Im Karriereportal stehen bereits neuere Runden.','112 Direkt 15_1/2026: Frist laut Drittseite 27.09.2026.','112 Classic 12_3/2026: laut Drittseite (praktischkommune.de) Frist 27.09.2026 (abgelaufen), Dauer 18 Monate, Anwärterbezüge 1.527,66 € plus Anwärtersonderzuschlag 880,60 €. Die Originalausschreibung ließ sich nicht öffnen, diese Zahlen sind deshalb nicht bestätigt.','Die Berliner Karriereportal-Seite nennt allgemein „mindestens 1.368 Euro (brutto)“ als Bezüge.']},
   {h:'Bewerbung bei der Berliner Feuerwehr',ol:['Öffne die Ausschreibung im Berliner Karriereportal und klick unten rechts auf „Jetzt bewerben“. Bewerbungen laufen ausschließlich online.','**Lade als PDF hoch** (max. 15 MB je Datei): Motivationsschreiben, Lebenslauf, Zeugnis des höchsten Schulabschlusses, Prüfungszeugnis der Ausbildung mit Note, Personalausweis (beidseitig), Führerschein B (beidseitig), Schwimmabzeichen Silber (kann nachgereicht werden), Punkteauszug aus Flensburg (nicht älter als 3 Monate, auch bei null Punkten). Unvollständige Bewerbungen werden nicht berücksichtigt.','Melde dich zum Sporttest Fitnesslevel 2 an. Nach Eingang der Bewerbung lädt die Feuerwehr zu den monatlichen Sportprüfungen ein, sie finden an zwei Tagen in der Monatsmitte statt.','Ein Online-Test folgt kurz nach Fristende (so bei 112 Direkt beschrieben). Danach Auswahlverfahren und Einstellungsuntersuchung.','In der Bewerbungsphase wird nur per E-Mail kommuniziert, **prüf auch den Spam-Ordner**.']}],
  todo:'**Ruf an und frag:** Zählt deine Polizeiausbildung als abgeschlossene Ausbildung für 112 Classic, und wann ist die nächste Frist?',
  calls:[['Bewerbungshotline der Berliner Feuerwehr','030 / 387 30 66 88','steht in den Ausschreibungen 112 Classic und 112 Direkt, am 24.11.2026 geprüft. Erreichbarkeitszeiten nennen sie nicht.']],
  links:[[38,'Berlin: Ausschreibung 112 Classic'],[39,'Berlin: Ausschreibung 112 Direkt'],[19,'Berlin: Karriereportal mit allen Stellen'],[37,'Berlin: Versetzungsausschreibung, nur für Feuerwehrbeamte']]},
 {t:'112 Dual: Studium bei der Berliner Feuerwehr',s:'gehobener Dienst, Frist 25.11.2026',fit:['mid','Hängt am Schulabschluss'],
  rows:[['Voraussetzung','Fachhochschulreife, dazu Sporttest Fitnesslevel 2. Weitere Einstellungsvoraussetzungen stehen im Karriereportal.'],['Studium','7 Semester, Bachelor „Brandschutz und Sicherheitstechnik“ (Vertiefung Brandschutz) an der Berliner Hochschule für Technik, praktische Teile an der Feuerwehr- und Rettungsdienst-Akademie. Danach 3 Jahre Probezeit.'],['Abschluss','Bachelor of Engineering und Laufbahnbefähigung für den gehobenen feuerwehrtechnischen Dienst'],['Bezüge','Anwärterbezüge **1.527,45 € brutto** (Stand 06/2026), dazu 50 € Hauptstadtzulage oder Zuschuss zum ÖPNV-Ticket und ca. 85 € Feuerwehrzulage ab dem 2. Jahr'],['Frist','**25.11.2026** (laut Arbeitsagentur), Studienbeginn **01.10.2027**']],
  p:['Die Angaben stammen von der Stellenseite der Arbeitsagentur. Die Originalausschreibung im Karriereportal ließ sich nicht öffnen, deshalb ist alles hier noch nicht gegen das Original geprüft.'],
  todo:'**Offen:** Ob du die Fachhochschulreife hast (dein Schulabschluss ist noch nicht bekannt), und ob dein Dienstverhältnis bei der Polizei ein Hindernis ist (zum Beispiel Entlassung auf eigenen Antrag). Je nach Schulabschluss lohnt sich ein Anruf heute oder morgen früh bei der Bewerbungshotline. Sonst zählt die nächste Runde.',
  calls:[['Bewerbungshotline Berliner Feuerwehr','030 / 387 30 66 88','Erreichbarkeit unbekannt']],
  links:[[41,'Arbeitsagentur: 112 Dual']]},
 {t:'Feuerwehr an der Ostsee',s:'Stralsund, Rostock, Greifswald, Kiel, Lübeck',fit:['mid','Nachfragen, was zählt'],
  p:['Alle fünf Städte stellen Beamtenanwärter im mittleren Dienst ein. In Mecklenburg-Vorpommern (Stralsund, Rostock, Greifswald) ist die Spezialausbildung oder öffentlich-rechtliche Ausbildung der Hebel für dich. Ob eine Polizeiausbildung dort anerkannt wird, entscheidet die Stadt. In Kiel und Lübeck sind Polizeiausbildungen in der Aufzählung nicht genannt, hier musst du nachfragen.'],
  city:[
   {n:'Stralsund',a:'Mittlere Reife, oder Berufsreife plus Berufsausbildung oder öffentlich-rechtliche Ausbildung; dazu feuerwehrgeeignete Gesellen- oder Abschlussprüfung oder Spezialausbildung',h:'Höchstalter 34',d:'18 Monate, 1.478,54 € brutto',s:'Start 01.10.2027, Frist 31.10.2026 abgelaufen',l:43},
   {n:'Rostock',a:'feuerwehrgeeignete Gesellenprüfung, Abschlussprüfung, Notfallsanitäter-Prüfung oder abgeschlossene Spezialausbildung; die oberste Dienstbehörde entscheidet über die Anerkennung',h:'Höchstalter 34',d:'18 Monate, Starts im April und Oktober',s:'Frist auf der Seite nicht genannt',l:44},
   {n:'Greifswald',a:'Mittlere Reife oder Berufsreife unter Voraussetzungen; Gesellenprüfung, Abschlussprüfung oder Spezialausbildung',h:'Höchstalter 34',d:'18 Monate, Schwimmabzeichen Bronze',s:'Zeitraum für Start 1.10.2026 begann am 1. August 2025; Ausschreibung für 2027 nicht gesehen, Bewerbung über greifswald.de/stellenangebote. Die Seite ließ sich bei der letzten Prüfung nicht öffnen.',l:null},
   {n:'Kiel',a:'erster allgemeinbildender Schulabschluss plus feuerwehrgeeignete Berufsausbildung oder Spezialausbildung (Notfallsanitäter, Rettungsassistent, Pflegeberuf); Schwimmabzeichen Silber; Erste-Hilfe-Kurs',h:'Höchstalter: keine Angabe auf der Seite',d:'Laut Ausschreibung Besoldung in der Ausbildung 1.467,18 € plus Anwärter*innensonderzuschlag 1.467,18 € (Summe rechnerisch rund 2.934 € brutto, bei Kiel nachfragen); Dauer auf der Seite nicht genannt',s:'Start 01.04.2028, Frist 02.05.2027',l:47},
   {n:'Lübeck',a:'erster allgemeinbildender Schulabschluss plus feuerwehrgeeignete Berufsausbildung oder Notfallsanitäter-Ausbildung',h:'Höchstalter: keine Angabe auf der Seite',d:'1,5 Jahre, Beamtenstatus ab Tag 1',s:'Bewerbung laut Seite in der Regel ein Jahr vor Start; feste Frist nicht genannt',l:48}],
  sec:[{h:'Stralsund: weitere Angaben',ul:['Zusätzlich verlangt Stralsund Führerschein B und das Schwimmabzeichen Bronze.','Für schwerbehinderte Menschen gilt Höchstalter 37.','Bewerbung in Stralsund online über Interamt. Die Stellenseite der Stadt ließ sich nicht öffnen, die Ausschreibung steht in der Linkliste.']}],
  calls:[['Hansestadt Stralsund, Herr Wendtland','03831 252 430','cwendtland@stralsund.de (laut Ausschreibung, am 24.11.2026 erneut geprüft)'],['Feuerwehr Rostock, Sachgebiet Personal und Dienstrecht','0381 / 381-3986','alternativ -3987 oder -3988']],
  links:[[43,'Stralsund: Ausschreibung Brandmeister 2027'],[44,'Rostock: Ausbildung Brandmeister, offizielle Seite'],[50,'Rostock: Karriere bei der Berufsfeuerwehr'],[46,'Kiel: Ausbildung Brandmeisteranwärter'],[47,'Kiel: Ausschreibung Start 2028'],[48,'Lübeck: Ausbildung Brandmeister']]}

app.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){const v=g.getAttribute('data-go');if(v)location.hash=v;else{history.pushState('',document.title,location.pathname);render()}return}
  const c=e.target.closest('[data-copy]');
  if(c){const v=c.getAttribute('data-copy');const done=()=>{c.textContent='Kopiert'};
    try{navigator.clipboard.writeText(v).then(done,()=>{c.textContent=v})}catch(x){c.textContent=v}return}
  const b=e.target.closest('.acc>button');
  if(b){const a=b.parentElement;const k=a.dataset.k;const o=!open.has(k);o?open.add(k):open.delete(k);
    a.dataset.open=o?1:0;b.setAttribute('aria-expanded',o);a.querySelector('.body').hidden=!o}
});
app.addEventListener('change',e=>{
  const d=e.target.closest('[data-doc]');
  if(d){let s={};try{s=JSON.parse(ls('docs')||'{}')}catch(x){}s[d.dataset.doc]=d.checked;ls('docs',JSON.stringify(s))}
});
